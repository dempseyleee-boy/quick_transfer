name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release configuration
        run: bash tool/verify_release_config.sh

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          test "${GITHUB_REF_NAME#v}" = "$version"

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Test and analyze
        run: |
          flutter pub get
          flutter test
          flutter analyze

  test-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Test and analyze
        run: |
          flutter pub get
          flutter test
          flutter analyze

  build-linux:
    needs: [verify, test-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Read version
        id: version
        run: echo "value=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build Linux release
        run: |
          flutter pub get
          flutter build linux --release

      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          install -d deb/DEBIAN deb/opt/quick_transfer deb/usr/bin
          cp -a build/linux/x64/release/bundle/. deb/opt/quick_transfer/
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec /opt/quick_transfer/quick_transfer_desktop "$@"' \
            > deb/usr/bin/quick-transfer
          chmod 755 deb/usr/bin/quick-transfer
          printf '%s\n' \
            'Package: quick-transfer' \
            "Version: $VERSION" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Depends: libgtk-3-0, liblzma5, libstdc++6' \
            'Maintainer: Quick Transfer Team' \
            'Description: Local network transfer application' \
            > deb/DEBIAN/control
          dpkg-deb --build --root-owner-group deb "quick-transfer_${VERSION}_amd64.deb"
          sha256sum "quick-transfer_${VERSION}_amd64.deb" > "quick-transfer_${VERSION}_amd64.deb.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: quick-transfer-linux-${{ steps.version.outputs.value }}-amd64
          path: |
            quick-transfer_${{ steps.version.outputs.value }}_amd64.deb
            quick-transfer_${{ steps.version.outputs.value }}_amd64.deb.sha256

  build-windows:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)').Matches.Groups[1].Value)
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip
          $hash = Get-FileHash quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip" |
            Out-File quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: quick-transfer-windows-${{ steps.version.outputs.value }}-x64
          path: |
            quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip
            quick-transfer_${{ steps.version.outputs.value }}_windows_x64.zip.sha256

  build-android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, test-mobile]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            'storeFile=upload-keystore.jks' \
            > android/key.properties

      - name: Read version
        id: version
        run: echo "value=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build signed Android releases
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/flutter-apk/app-release.apk "quick-transfer_${{ steps.version.outputs.value }}_android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "quick-transfer_${{ steps.version.outputs.value }}_android.aab"
          sha256sum quick-transfer_${{ steps.version.outputs.value }}_android.* > quick-transfer_${{ steps.version.outputs.value }}_android.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: quick-transfer-android-${{ steps.version.outputs.value }}
          path: |
            mobile/quick-transfer_${{ steps.version.outputs.value }}_android.apk
            mobile/quick-transfer_${{ steps.version.outputs.value }}_android.aab
            mobile/quick-transfer_${{ steps.version.outputs.value }}_android.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
